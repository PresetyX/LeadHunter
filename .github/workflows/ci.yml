name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Testes, typecheck e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Testes (node:test)
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build de produção
        env:
          # Segredo descartável só para o build; os segredos reais ficam na Vercel.
          AUTH_SECRET: ci-only-build-secret-not-used-in-production
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
